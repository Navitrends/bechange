# À utiliser quand Docker Desktop est installé
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bricodari
      POSTGRES_PASSWORD: bricodari
      POSTGRES_DB: bricodari_prices
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://bricodari:bricodari@db:5432/bricodari_prices
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis

volumes:
  pgdata:
